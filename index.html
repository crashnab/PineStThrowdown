<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pine St Throwdown</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }

      #game {
        width: 100%;
        height: 100%;
      }

      #boot-error {
        display: none;
        color: #f5f5f5;
        font-family: system-ui, sans-serif;
        padding: 24px;
      }
    </style>
    <!--
      Import maps let the browser resolve `import Phaser from 'phaser'`
      without Webpack. Pin the Phaser 3 ESM build so a CDN update cannot
      silently bump us to Phaser 4.
    -->
    <script type="importmap">
      {
        "imports": {
          "phaser": "https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.esm.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="game"></div>
    <p id="boot-error">
      Could not start Pine St Throwdown. Open the browser console for details.
    </p>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
